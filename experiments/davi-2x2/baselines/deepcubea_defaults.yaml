# DeepCubeA defaults — comparison baseline only, NOT M5's starting config.
#
# These are the published DeepCubeA / draft-spec values, repurposed
# directly for the 2x2 cube with no measurement of their fitness here.
# They appear in this file so any tier 3 result can be compared against
# the canonical literature config: "we differ in [X], match in [Y]."
#
# M5's actual training config is *earned* tier-by-tier:
#   - tier 0  (calibrate_step_time.py)        — measures step time per
#                                                (batch, body, blocks)
#   - tier 1  (sanity runs, downscaled cube)  — verifies DAVI converges
#   - tier 2  (single-axis sweeps mid-scale)  — finds working regimes
#   - tier 3  (champion full-scale run)       — meets M5 acceptance gate
#
# Do NOT load this file as the starting point of a real run. It is a
# baseline for cross-reference and a ceiling on "what we'd have done
# without methodology."

max_scramble_depth: 14            # 2x2 QTM diameter (M5 V* enumerator: max 14)
batch_size: 1000                  # DeepCubeA published
n_steps: 100000                   # DeepCubeA published
learning_rate: 0.0001             # DeepCubeA published (Adam)
target_sync_interval: 5000        # DeepCubeA published
body_widths: [5000, 1000]         # DeepCubeA / draft-spec
n_residual_blocks: 4              # DeepCubeA / draft-spec
log_every: 100
eval_every: 5000
checkpoint_every: 10000
seed: 0
device: mps
