# Phase 3 smaller-net overnight comparison run — 3x3 DAVI.
#
# Comparison data point against today's full_train (which used
# `[5120, 1024] × 4 BN`, ~15.3M params, K_max=20, 100k cap; early-
# stopped at step 16k under a macro_v_star_mae plateau that beam-eval
# revealed was actually calibration drift, not capability regression —
# see LOG.md "M8 full 3x3 training run" outcome).
#
# What changes here:
# - body_widths [5120, 1024] → [2048, 1024]: hand-picked first-layer
#   width compression while preserving the residual-block width. NOT
#   borrowed (CLAUDE.md "earn every hyperparameter — do not borrow"
#   applies). ~25% fewer params (~11.2M vs full_train's 15.3M).
# - n_steps 100000 → 50000: overnight budget; runs in ~3-4h at smoke
#   pace. Halving the budget alongside the smaller arch keeps the
#   wall-time reasonable.
# - checkpoint_every 5000 → 2000: smaller checkpoints for cancel-safety
#   per the parent's plan. With 25 checkpoints over the run vs.
#   full_train's 10, post-hoc beam trajectory is denser.
# - early_stop_enabled true → false: wiring removed in this branch
#   (commit 57efb5f); explicit `false` here even though the field is
#   ignored, so the config's intent matches the runtime behavior.
#
# What stays the same as full_train (this run isolates arch + budget
# effects from everything else):
# - K_max=20 flat (no warm-start, no ramp).
# - target_sync_interval=500.
# - eval_every=500.
# - batch_size=4096.
# - learning_rate=0.001.
# - n_residual_blocks=4, normalization=bn.
# - device=mps, seed=0.
#
# Goal: a SECOND data point on the architecture/budget axis at this
# K_max — not a "real" experiment per the user's framing. Breaks the
# n=1 anchor on `[5120, 1024]` so we know whether full_train's deep-d
# beam climb is robust to capacity reduction.

max_scramble_depth: 20
max_scramble_depth_initial: 0
max_scramble_depth_ramp_steps: 0

batch_size: 4096
n_steps: 50000
learning_rate: 0.001
target_sync_interval: 500

body_widths:
  - 2048
  - 1024
n_residual_blocks: 4
normalization: bn

log_every: 100
eval_every: 500
checkpoint_every: 2000
seed: 0
device: mps

early_stop_enabled: false
early_stop_metric: macro_v_star_mae
early_stop_patience_evals: 12
early_stop_min_evals: 4
early_stop_min_delta: 0.001
