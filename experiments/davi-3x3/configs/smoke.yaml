# Phase 2 smoke training config — 3x3 DAVI.
#
# Goal: verify the wired-up training loop works end-to-end on 3x3
# (loss decreases, no NaN, no MPS errors), watch macro_v_star_mae
# evolve, characterize early-stop behavior in practice, produce a
# first 3x3 capability data point post-training.
#
# Architecture: hand-picked guess (per CLAUDE.md "earn every
# hyperparameter — do not borrow"). 5120 = 5x1024, MPS-aligned;
# acknowledges 3x3's wider input (324 vs 144 one-hot dims) without
# over-scaling. NOT borrowed from any prior published net. T0
# capacity sweep is deferred to backlog.
#
# Scrambles: max_scramble_depth=8 — slightly beyond the bounded V*
# oracle reach (K=6) so training exercises bootstrap on out-of-V*
# states.
#
# Early-stop: 12 sync-period patience + 4-sync warmup + 0.001
# min_delta on macro_v_star_mae. Conservative — at sync_interval=500,
# 12 patience = 6000 steps of plateau before stopping.

max_scramble_depth: 8
max_scramble_depth_initial: 0
max_scramble_depth_ramp_steps: 0

batch_size: 4096
n_steps: 10000
learning_rate: 0.001
target_sync_interval: 500

body_widths:
  - 5120
  - 1024
n_residual_blocks: 4
normalization: bn

log_every: 100
eval_every: 500
checkpoint_every: 2500
seed: 0
device: mps

early_stop_enabled: true
early_stop_metric: macro_v_star_mae
early_stop_patience_evals: 12
early_stop_min_evals: 4
early_stop_min_delta: 0.001
