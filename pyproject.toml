[project]
name = "rubik"
version = "0.1.0"
description = "Deep RL solver for the Rubik's Cube on Apple Silicon (MPS) — DAVI training + GPU beam search."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "torch>=2.11.0",
    "wandb>=0.26.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.scripts]
rubik-serve = "rubik.server.app:run"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.0.3",
    "pytest-snapshot>=0.9.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: opt-in slow tests (load real model, exercise MPS)",
]
addopts = "-m 'not slow'"

[tool.basedpyright]
pythonVersion = "3.12"
